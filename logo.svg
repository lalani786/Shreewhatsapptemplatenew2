<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Accent Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glowing Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>

    <filter id="innerSparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Rounded Container with glow -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle Glass Border -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="25.5" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Inner Ambient Shimmer -->
  <path d="M 12 28 C 12 18, 20 10, 32 8 C 45 6, 68 8, 88 28 C 76 34, 52 38, 28 36 C 18 35, 13 32, 12 28 Z" fill="#ffffff" fill-opacity="0.12" />

  <!-- Stylized Messenger Speech Bubble -->
  <path d="M 28 34 C 28 26.268 34.268 20 42 20 H 60 C 67.732 20 74 26.268 74 34 V 50 C 74 57.732 67.732 64 60 64 H 46 L 33 73 V 64 C 30 64 28 61.5 28 58 Z" 
        fill="#042f2e" fill-opacity="0.45" />

  <!-- AI Pulse Wave / Modern 'S' Wave inside bubble -->
  <path d="M 39 42 C 43 36, 51 36, 55 41 C 59 46, 67 45, 68 40" 
        stroke="url(#sparkleGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lower Connected Wave -->
  <path d="M 34 50 C 37 54, 45 56, 52 52 C 57 49, 62 50, 65 54" 
        stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Brilliance AI Star / Sparkle -->
  <path d="M 52 28 Q 52 36 60 36 Q 52 36 52 44 Q 52 36 44 36 Q 52 36 52 28 Z" 
        fill="url(#sparkleGrad)" filter="url(#innerSparkle)" />

  <!-- Secondary Tiny Micro-Sparkle -->
  <path d="M 68 26 Q 68 30 72 30 Q 68 30 68 34 Q 68 30 64 30 Q 68 30 68 26 Z" 
        fill="#ffffff" opacity="0.9" />

  <!-- Active AI Live Dot -->
  <circle cx="70" cy="68" r="4.5" fill="#34d399" />
  <circle cx="70" cy="68" r="7" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
</svg>
